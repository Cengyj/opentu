user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    # The pinned Alpine Nginx MIME table omits desktop font extensions emitted
    # by Vite. Keep immutable font responses typed instead of falling through
    # to application/octet-stream.
    types {
        font/otf otf;
        font/ttf ttf;
    }
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    etag on;
    server_tokens off;

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Release-control resources must always reach the origin. Missing
        # control files are hard failures and must never fall back to the SPA.
        location = /sw.js {
            try_files $uri =404;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        location ~ ^/(?:version|precache-manifest|idle-prefetch-manifest|changelog)\.json$ {
            try_files $uri =404;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        location = /manifest.json {
            try_files $uri =404;
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        # Vite emits an eight-character content hash before the extension.
        # The release gate independently rejects any unhashed file in /assets,
        # so this is the only location allowed to emit immutable caching.
        location ~ "^/assets/.+-[-_A-Za-z0-9]{8}\.[A-Za-z0-9]+$" {
            try_files $uri =404;
            # Do not use `always` here: a transient/missing hashed asset must
            # never turn its 404 response into a one-year immutable cache hit.
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Content-Type-Options "nosniff" always;
            add_header Access-Control-Allow-Origin "*" always;
        }

        # An unexpected unhashed build asset is deliberately revalidated. The
        # pre-promotion release gate will reject the artifact before publishing.
        location /assets/ {
            try_files $uri =404;
            add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Access-Control-Allow-Origin "*" always;
        }

        location = / {
            try_files /index.html =404;
            add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "origin-when-cross-origin" always;
        }

        location = /index.html {
            try_files $uri =404;
            add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "origin-when-cross-origin" always;
        }

        location ~* \.html$ {
            try_files $uri =404;
            add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "origin-when-cross-origin" always;
        }

        # Every non-hashed resource is explicitly revalidated. Unknown SPA
        # navigation paths resolve to index.html with the same HTML policy.
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "origin-when-cross-origin" always;
        }
    }
}
