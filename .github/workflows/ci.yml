name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  # PR 时运行：lint、test、build 和冒烟测试
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # 安装 pnpm 后再启用 setup-node 的 pnpm 缓存，否则 runner PATH 中找不到 pnpm
      - uses: pnpm/action-setup@v6
        with:
          version: 10.21.0
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - uses: nrwl/nx-set-shas@v4

      # 安装 Playwright 浏览器和依赖
      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      # nx-set-shas provides NX_BASE/NX_HEAD for both push and pull_request.
      # Run affected checks against those SHAs, then always produce the web
      # artifact required by startup and bundle-size verification.
      - run: npx nx affected -t test --verbose
      - name: Test User Manual Build Contract
        run: pnpm run manual:test
      - name: Test release static contract
        run: pnpm run release:static:test
      - name: Verify portable Drawnix declarations
        run: pnpm run verify:drawnix-declarations
      - run: npx nx affected -t lint --exclude=drawnix --verbose
      - name: Build web production artifact
        id: build-web
        env:
          OPENTU_RELEASE_ID: ${{ github.sha }}
          GITHUB_SHA: ${{ github.sha }}
        run: pnpm build:web
      - name: Verify production artifact release identity
        run: >-
          pnpm run release:static:create --
          --dist dist/apps/web
          --output "${{ runner.temp }}/release-static-contract.json"
          --expected-release-id "${{ github.sha }}"
          --expected-version "$(node -p "require('./package.json').version")"
      - name: Verify startup bundle
        run: pnpm verify:startup

      # PR 时运行冒烟测试（快速，约2分钟）
      - name: Run Smoke Tests
        run: pnpm run e2e:smoke

      - name: Upload Smoke Test Results
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: smoke-test-results
          path: apps/web-e2e/test-results/

      # Playwright snapshots are platform-specific. Only run the Linux visual
      # suite after reviewed Linux baselines have been committed; never accept
      # runner-generated screenshots as baselines automatically.
      - name: Detect Linux visual baselines
        id: linux-visual-baselines
        shell: bash
        run: |
          if find apps/web-e2e/src/visual -type f -name '*-linux.png' -print -quit | grep -q .; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Skipping visual regression tests because no reviewed Linux baselines are committed."
          fi

      - name: Run Visual Regression Tests
        if: steps.linux-visual-baselines.outputs.available == 'true'
        run: pnpm run e2e:visual

      - name: Upload Visual Test Report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: visual-diff-report
          path: apps/web-e2e/playwright-report/

      - name: Check Bundle Size
        # AI Chat has a documented pre-existing 140 kB budget violation tracked
        # by refactor-startup-shell-loading. Keep reporting it without masking
        # test/build failures until that approved architecture change lands.
        if: always() && steps.build-web.outcome == 'success'
        continue-on-error: true
        run: pnpm run size

      - name: Upload Bundle Stats
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: bundle-stats
          path: dist/apps/web/stats.html

  # 发布前运行：完整 E2E 测试 + 生成用户手册
  release-e2e:
    runs-on: ubuntu-latest
    # 仅在 main 分支 push 或手动触发时运行
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 10.21.0
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # 安装所有浏览器用于完整测试
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      # 运行完整功能测试
      - name: Run Full E2E Tests
        run: pnpm run e2e:features

      - name: Detect Linux visual baselines
        id: linux-visual-baselines
        shell: bash
        run: |
          if find apps/web-e2e/src/visual -type f -name '*-linux.png' -print -quit | grep -q .; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Skipping visual regression tests because no reviewed Linux baselines are committed."
          fi

      - name: Run Visual Tests
        if: steps.linux-visual-baselines.outputs.available == 'true'
        run: pnpm run e2e:visual

      # 运行手册生成测试
      - name: Run Manual Generation Tests
        run: pnpm run e2e:manual

      # 生成并完整校验用户手册（全部 MDX 必须有对应 HTML）
      - name: Generate and Verify User Manual
        run: pnpm run manual:build

      # 上传测试报告
      - name: Upload E2E Test Report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-test-report
          path: apps/web-e2e/playwright-report/

      # 上传测试结果（包含截图）
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-test-results
          path: apps/web-e2e/test-results/

      # 上传用户手册
      - name: Upload User Manual
        uses: actions/upload-artifact@v6
        with:
          name: user-manual
          path: apps/web/public/user-manual/
