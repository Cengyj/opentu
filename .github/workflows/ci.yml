name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  # Quality gates run independently from the production build. Existing lint
  # debt is fingerprinted; every new diagnostic still fails this job.
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # 安装 pnpm 后再启用 setup-node 的 pnpm 缓存，否则 runner PATH 中找不到 pnpm
      - uses: pnpm/action-setup@v6
        with:
          version: 10.21.0
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - uses: nrwl/nx-set-shas@v4

      # nx-set-shas provides NX_BASE/NX_HEAD for both push and pull_request.
      - run: npx nx affected -t test --verbose
      - name: Test User Manual Build Contract
        run: pnpm run manual:test
      - name: Test release static contract
        run: pnpm run release:static:test
      - name: Verify portable Drawnix declarations
        run: pnpm run verify:drawnix-declarations
      - name: Test CI workflow contract
        run: pnpm run ci:workflow:test
      - name: Test lint regression contract
        run: pnpm run lint:regression:test
      - name: Reject new lint diagnostics
        run: pnpm run lint:regression

  # Build is an independent required result: a lint or unit-test failure must
  # never make compilation look as if it ran and failed.
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 10.21.0
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Build web production artifact
        id: build-web
        env:
          OPENTU_RELEASE_ID: ${{ github.sha }}
          GITHUB_SHA: ${{ github.sha }}
        run: pnpm build:web
      - name: Verify production artifact release identity
        run: >-
          pnpm run release:static:create --
          --dist dist/apps/web
          --output "${{ runner.temp }}/release-static-contract.json"
          --expected-release-id "${{ github.sha }}"
          --expected-version "$(node -p "require('./package.json').version")"
      - name: Verify startup bundle
        run: pnpm verify:startup

      - name: Upload production web artifact
        uses: actions/upload-artifact@v6
        with:
          # Stable across partial reruns so a retried smoke job can still
          # consume the artifact from the successful main job. Full reruns may
          # replace it with the newly built artifact for the same workflow run.
          name: web-production-${{ github.run_id }}
          path: dist/apps/web/
          if-no-files-found: error
          include-hidden-files: true
          overwrite: true
          retention-days: 1

      - name: Check Bundle Size
        # AI Chat has a documented pre-existing 140 kB budget violation tracked
        # by refactor-startup-shell-loading. Keep reporting it without masking
        # test/build failures until that approved architecture change lands.
        continue-on-error: true
        run: pnpm run size

      - name: Upload Bundle Stats
        uses: actions/upload-artifact@v6
        with:
          name: bundle-stats-${{ github.sha }}-${{ github.run_attempt }}
          path: dist/apps/web/stats.html
          if-no-files-found: error

  # Browser checks consume the exact artifact produced by main. Playwright
  # installation or runtime failures cannot turn the build result into skipped.
  smoke:
    needs: main
    runs-on: ubuntu-latest
    env:
      BASE_URL: http://localhost:7200
      # Browser contracts must execute against the artifact downloaded in this
      # attempt; replaying an Nx result could skip the preview server entirely.
      NX_SKIP_NX_CACHE: 'true'
      PLAYWRIGHT_WEB_SERVER_COMMAND: >-
        pnpm exec nx run web:preview --
        --host=localhost --port=7200 --strictPort
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 10.21.0
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Download production web artifact
        uses: actions/download-artifact@v6
        with:
          name: web-production-${{ github.run_id }}
          path: dist/apps/web

      - name: Verify downloaded artifact release identity
        run: >-
          pnpm run release:static:create --
          --dist dist/apps/web
          --output "${{ runner.temp }}/downloaded-release-static-contract.json"
          --expected-release-id "${{ github.sha }}"
          --expected-version "$(node -p "require('./package.json').version")"

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Run production artifact smoke tests
        id: smoke-tests
        run: pnpm run e2e:smoke

      - name: Upload Smoke Test Results
        if: always() && steps.smoke-tests.outcome == 'failure'
        uses: actions/upload-artifact@v6
        with:
          name: smoke-test-results-${{ github.sha }}-${{ github.run_attempt }}
          path: apps/web-e2e/test-results/
          if-no-files-found: error

      # Playwright snapshots are platform-specific. Only run the Linux visual
      # suite after reviewed Linux baselines have been committed; never accept
      # runner-generated screenshots as baselines automatically.
      - name: Detect Linux visual baselines
        id: linux-visual-baselines
        shell: bash
        run: |
          if find apps/web-e2e/src/visual -type f -name '*-linux.png' -print -quit | grep -q .; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Skipping visual regression tests because no reviewed Linux baselines are committed."
          fi

      - name: Run Visual Regression Tests
        id: visual-tests
        if: steps.linux-visual-baselines.outputs.available == 'true'
        run: pnpm run e2e:visual

      - name: Upload Visual Test Report
        if: always() && steps.visual-tests.outcome == 'failure'
        uses: actions/upload-artifact@v6
        with:
          name: visual-diff-report-${{ github.sha }}-${{ github.run_attempt }}
          path: apps/web-e2e/playwright-report/
          if-no-files-found: error

  # 发布前运行：完整 E2E 测试 + 生成用户手册
  release-e2e:
    runs-on: ubuntu-latest
    # 仅在 main 分支 push 或手动触发时运行
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 10.21.0
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # 安装所有浏览器用于完整测试
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      # 运行完整功能测试
      - name: Run Full E2E Tests
        run: pnpm run e2e:features

      - name: Detect Linux visual baselines
        id: linux-visual-baselines
        shell: bash
        run: |
          if find apps/web-e2e/src/visual -type f -name '*-linux.png' -print -quit | grep -q .; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Skipping visual regression tests because no reviewed Linux baselines are committed."
          fi

      - name: Run Visual Tests
        if: steps.linux-visual-baselines.outputs.available == 'true'
        run: pnpm run e2e:visual

      # 运行手册生成测试
      - name: Run Manual Generation Tests
        run: pnpm run e2e:manual

      # 生成并完整校验用户手册（全部 MDX 必须有对应 HTML）
      - name: Generate and Verify User Manual
        run: pnpm run manual:build

      # 上传测试报告
      - name: Upload E2E Test Report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-test-report-${{ github.sha }}-${{ github.run_attempt }}
          path: apps/web-e2e/playwright-report/

      # 上传测试结果（包含截图）
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-test-results-${{ github.sha }}-${{ github.run_attempt }}
          path: apps/web-e2e/test-results/

      # 上传用户手册
      - name: Upload User Manual
        uses: actions/upload-artifact@v6
        with:
          name: user-manual-${{ github.sha }}-${{ github.run_attempt }}
          path: apps/web/public/user-manual/
